services:
  db:
    container_name: postgresql_db
    image: postgres:trixie
    networks:
      - main
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: always

  redis:
    container_name: redis
    image: redis:6
    networks:
      - main
    env_file:
      - .env
    ports:
      - "6379:6379"

  app:
    container_name: app
    build: .
    networks:
      - main
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/src/
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"


networks:
  main:
volumes:
  postgres_data:
    